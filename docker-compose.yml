# Optional local stack for developers who want server-based services
# without manually installing Qdrant or Ollama.
#
# Usage:
#   docker compose up -d
#   ollama pull llama3.2          # if using the ollama service
#   ollama pull nomic-embed-text
#
# Then run:
#   cd GenerellemConsole
#   dotnet run -- --profile Ollama
#   # or with Azure OpenAI embeddings + local Qdrant:
#   dotnet run -- --profile Azure

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  ollama_data:
