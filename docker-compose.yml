# Optional local stack for developers who want server-based services
# without manually installing Qdrant or Ollama.
#
# Usage:
#   docker compose up -d
#   docker compose exec ollama ollama pull llama3.2
#   docker compose exec ollama ollama pull nomic-embed-text
#
# Do not also run a host Ollama on port 11434. The compose service already
# publishes that port. A host `ollama pull` works only when the host CLI
# talks to localhost:11434 and nothing else owns the port.
#
# Then run:
#   cd GenerellemConsole
#   dotnet run -- --profile Ollama
#   # or with Azure OpenAI embeddings + local Qdrant:
#   dotnet run -- --profile Azure

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  qdrant_data:
  ollama_data:
