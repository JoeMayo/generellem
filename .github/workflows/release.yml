name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Pack
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          dotnet pack Generellem/Generellem.csproj --configuration Release -p:Version="$version" -p:ContinuousIntegrationBuild=true -o "$RUNNER_TEMP/nupkg"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/nupkg/*.nupkg \
            --title "v$version" \
            --notes "Generellem $version"
